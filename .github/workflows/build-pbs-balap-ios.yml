name: Build PBS Balap iOS
on:
  push:
    branches: [pbs-balap-ios-v1]
    paths:
      - "ios/**"
      - ".github/workflows/build-pbs-balap-ios.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate official PBS app icons
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python ios/tools/make_icons.py
      - name: Validate Xcode project
        run: |
          xcodebuild -list -project ios/PBSBalap.xcodeproj
          plutil -lint ios/PBSBalap/Info.plist
      - name: Compile for iOS Simulator
        run: |
          xcodebuild -project ios/PBSBalap.xcodeproj \
            -scheme PBSBalap -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/pbs-balap-simulator" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Compile native iPhone device app (unsigned)
        run: |
          xcodebuild -project ios/PBSBalap.xcodeproj \
            -scheme PBSBalap -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/pbs-balap-device" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Regression check - reject unsigned IPA before OTA distribution
        run: |
          set -euo pipefail
          TEST_DIR="$RUNNER_TEMP/unsigned-regression"
          mkdir -p "$TEST_DIR/Payload"
          cp -R "$RUNNER_TEMP/pbs-balap-device/Build/Products/Release-iphoneos/PBSBalap.app" "$TEST_DIR/Payload/"
          (cd "$TEST_DIR" && zip -qr "$RUNNER_TEMP/unsigned-regression.ipa" Payload)
          if python3 ios/tools/verify_signed_ipa.py "$RUNNER_TEMP/unsigned-regression.ipa"; then
            echo "::error::SECURITY ERROR: unsigned IPA unexpectedly passed OTA validation"
            exit 1
          else
            echo "PASS: unsigned IPA rejected; only properly signed and provisioned IPA can be uploaded for distribution"
          fi
      - name: Package build-only output (NOT installable on physical iPhone)
        run: |
          set -eu
          mkdir -p ios-build-out
          SIM_APP="$RUNNER_TEMP/pbs-balap-simulator/Build/Products/Release-iphonesimulator/PBSBalap.app"
          DEVICE_APP="$RUNNER_TEMP/pbs-balap-device/Build/Products/Release-iphoneos/PBSBalap.app"
          test -d "$SIM_APP"
          test -d "$DEVICE_APP"
          # Intentionally do NOT publish an unsigned .ipa, which would fail through BetaDrop.
          (cd "$(dirname "$DEVICE_APP")" && zip -qr "$GITHUB_WORKSPACE/ios-build-out/PBS-Balap-v1.0.1-UNSIGNED-Device-App-NOT-INSTALLABLE.zip" PBSBalap.app)
          (cd "$(dirname "$SIM_APP")" && zip -qr "$GITHUB_WORKSPACE/ios-build-out/PBS-Balap-v1.0.1-iOS-Simulator.app.zip" PBSBalap.app)
          printf '%s\n' 'These are build diagnostics only. Do NOT upload to BetaDrop.' 'For an installable signed IPA, use the Sign and Verify PBS Balap IPA (BetaDrop) workflow with valid Apple Developer signing credentials and registered iPhone UDIDs.' > ios-build-out/IMPORTANT-READ-FIRST.txt
          ls -lh ios-build-out
      - name: Upload iOS build outputs
        uses: actions/upload-artifact@v4
        with:
          name: PBS_Balap_iOS_v1.0.1_BUILD_ONLY_NO_IPA
          path: ios-build-out/
          retention-days: 30
          if-no-files-found: error
