name: Sign and Export PBS Balap IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Apple signing credentials
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PASS: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          test -n "$CERT" && test -n "$PASS" && test -n "$PROFILE" && test -n "$TEAM" || {
            echo "Required Apple secrets not configured. Read ios/README.md."
            exit 1
          }
      - name: Generate PBS app icon
        run: |
          python -m pip install Pillow
          python ios/tools/make_icons.py
      - name: Install Apple signing assets into temporary keychain
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PASS: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/pbsbalap.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Compile and sign device archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -project ios/PBSBalap.xcodeproj \
            -scheme PBSBalap -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PBSBalap.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" archive
      - name: Export IPA for registered devices
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/export" ios-signed-output
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>release-testing</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$IOS_TEAM_ID</string>
          <key>provisioningProfiles</key><dict>
          <key>id.pbsgroup.pbsbalap</key><string>$PROFILE_NAME</string>
          </dict></dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PBSBalap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP/export/"*.ipa ios-signed-output/PBS-Balap-SIGNED-AdHoc.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PBS_Balap_iOS_SIGNED_AdHoc_IPA
          path: ios-signed-output/PBS-Balap-SIGNED-AdHoc.ipa
          retention-days: 30
          if-no-files-found: error
