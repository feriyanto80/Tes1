name: Sign and Verify PBS Balap IPA (BetaDrop)
on:
  workflow_dispatch:
  push:
    branches: [pbs-balap-ios-v1]
    paths:
      - "ios/signing/trigger.txt"
permissions:
  contents: read
jobs:
  sign-verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check required Apple Developer secrets
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PASS: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CERT" ] || [ -z "$PASS" ] || [ -z "$PROFILE" ] || [ -z "$TEAM" ]; then
            echo "::error::No signed IPA can be created: Apple Developer signing secrets are missing. See ios/README.md."
            exit 1
          fi
          if ! [[ "$TEAM" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::IOS_TEAM_ID must be a valid 10-character Apple Team ID."
            exit 1
          fi
      - name: Prepare official PBS logo
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 ios/tools/make_icons.py
      - name: Import signing identity and Ad Hoc profile
        shell: bash
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PASS: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # macOS base64 uses -D; --decode from Linux is not portable.
          printf '%s' "$CERT" | base64 -D > "$RUNNER_TEMP/pbs-distribution.p12"
          printf '%s' "$PROFILE" | base64 -D > "$RUNNER_TEMP/pbs-adhoc.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/pbs-adhoc.mobileprovision" > "$RUNNER_TEMP/adhoc.plist"
          python3 - "$RUNNER_TEMP/adhoc.plist" "$TEAM" <<'PY'
          import datetime, plistlib, sys
          with open(sys.argv[1],"rb") as f: p=plistlib.load(f)
          team=sys.argv[2]
          assert team in p.get("TeamIdentifier",[]), "Apple Team mismatch"
          ent=p.get("Entitlements",{})
          assert ent.get("application-identifier","").endswith(".id.pbsgroup.pbsbalap"), "App ID mismatch"
          devices=p.get("ProvisionedDevices",[])
          assert devices and not p.get("ProvisionsAllDevices"), "Not an Ad Hoc profile with registered devices"
          expiration=p.get("ExpirationDate")
          assert expiration and expiration > datetime.datetime.utcnow(), "Provisioning expired"
          print("Ad Hoc provisioning matches app/team; device count:", len(devices))
          PY
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/adhoc.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/adhoc.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/pbs-adhoc.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/pbs-balap.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security import "$RUNNER_TEMP/pbs-distribution.p12" \
            -k "$KEYCHAIN" -P "$PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -q "Apple Distribution" || { echo "::error::Apple Distribution identity missing"; exit 1; }
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive signed device application
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project ios/PBSBalap.xcodeproj \
            -scheme PBSBalap -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PBSBalap.xcarchive" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" archive
      - name: Export signed IPA using Ad Hoc release-testing
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>release-testing</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$IOS_TEAM_ID</string>
          <key>provisioningProfiles</key><dict>
          <key>id.pbsgroup.pbsbalap</key><string>$PROFILE_NAME</string>
          </dict></dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PBSBalap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
      - name: Verify app signature and device provisioning before uploading
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p ios-signed-output
          mapfile -t IPA_FILES < <(find "$RUNNER_TEMP/export" -maxdepth 1 -type f -name '*.ipa')
          if [ "${#IPA_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one exported IPA."
            exit 1
          fi
          python3 ios/tools/verify_signed_ipa.py "${IPA_FILES[0]}" \
            --team "$IOS_TEAM_ID" --report ios-signed-output/VERIFICATION.json
          cp "${IPA_FILES[0]}" ios-signed-output/PBS-Balap-v1.0.1-SIGNED-AdHoc.ipa
      - name: Upload ONLY verified signed IPA for BetaDrop
        uses: actions/upload-artifact@v4
        with:
          name: PBS_Balap_v1.0.1_BetaDrop_SIGNED_IPA
          path: ios-signed-output/
          retention-days: 30
          if-no-files-found: error
