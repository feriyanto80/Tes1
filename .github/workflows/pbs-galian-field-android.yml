name: PBS Galian Field - Build APK Debug
on:
  push:
    branches:
      - pbs-galian-field-android-v1
    paths:
      - 'pbs-galian-field/android/**'
      - '.github/workflows/pbs-galian-field-android.yml'
  workflow_dispatch:
    inputs:
      app_url:
        description: URL HTTPS aplikasi PBS Galian Field
        type: string
        required: true
        default: https://galian.pbsgroup.id/
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android Platform 35
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: pbs-galian-field/android
        env:
          SERVER_URL: ${{ inputs.app_url || vars.PBS_GALIAN_URL || 'https://galian.pbsgroup.id/' }}
        run: gradle :app:assembleDebug --no-daemon -PpbsBaseUrl="$SERVER_URL"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PBS-Galian-Field-v1.2.7-debug-APK
          path: pbs-galian-field/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
