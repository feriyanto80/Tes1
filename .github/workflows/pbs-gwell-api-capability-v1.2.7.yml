name: Build PBS Yoosee API Capability Scanner v1.2.7
on:
  push:
    branches: [pbs-gwell-api-capability-v1.2.7]
    paths:
      - 'pbs-gwell-cloud-test/**'
      - '.github/workflows/pbs-gwell-api-capability-v1.2.7.yml'
  workflow_dispatch:
concurrency:
  group: pbs-gwell-api-capability-v1.2.7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch archived GWTimes native IoTVideo SDK AAR
        run: |
          mkdir -p pbs-gwell-cloud-test/app/libs
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/GWTimes/IoTVideo-Android/master/app/libs/iotvideo-release.aar" \
            -o pbs-gwell-cloud-test/app/libs/iotvideo-release.aar
          test "$(stat -c%s pbs-gwell-cloud-test/app/libs/iotvideo-release.aar)" -gt 9000000
          unzip -t pbs-gwell-cloud-test/app/libs/iotvideo-release.aar | tail -n 2
      - name: Build Android API Capability Scanner APK
        run: gradle -p pbs-gwell-cloud-test :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PBS_Gwell_API_Capability_Scanner_v1.2.7
          path: pbs-gwell-cloud-test/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish direct GitHub APK
        run: |
          mkdir -p pbs-gwell-cloud-test/releases
          cp pbs-gwell-cloud-test/app/build/outputs/apk/debug/app-debug.apk pbs-gwell-cloud-test/releases/PBS_Gwell_API_Capability_Scanner_v1.2.7.apk
          cd pbs-gwell-cloud-test/releases
          sha256sum PBS_Gwell_API_Capability_Scanner_v1.2.7.apk > PBS_Gwell_API_Capability_Scanner_v1.2.7.apk.sha256
          cd ../../
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pbs-gwell-cloud-test/releases/
          if git diff --staged --quiet; then echo "APK unchanged"; else
            git commit -m "Publish PBS Gwell API Capability Scanner v1.2.7 APK [skip ci]"
            git push origin HEAD:pbs-gwell-api-capability-v1.2.7
          fi
