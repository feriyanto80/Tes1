name: Build PBS Yoosee Diagnostic APK
on:
  push:
    branches: [pbs-yoosee-sdk-test]
    paths:
      - 'pbs-yoosee-test/**'
      - '.github/workflows/yoosee-test-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p pbs-yoosee-test :app:assembleDebug --stacktrace --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PBS_Yoosee_Diagnostic_v1.0.0
          path: pbs-yoosee-test/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish APK for direct GitHub download
        run: |
          mkdir -p pbs-yoosee-test/releases
          cp pbs-yoosee-test/app/build/outputs/apk/debug/app-debug.apk pbs-yoosee-test/releases/PBS_Yoosee_Diagnostic_v1.0.0.apk
          cd pbs-yoosee-test/releases
          sha256sum PBS_Yoosee_Diagnostic_v1.0.0.apk > PBS_Yoosee_Diagnostic_v1.0.0.apk.sha256
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pbs-yoosee-test/releases/
          if git diff --staged --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish PBS Yoosee Diagnostic APK for direct download [skip ci]"
            git push origin HEAD:pbs-yoosee-sdk-test
          fi
