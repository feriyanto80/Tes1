name: Build PBS Balap Forms No-Conflict APK
on:
  push:
    branches: [pbs-balap-unified-no-conflict-v1]
    paths:
      - 'pbs-mobile/**'
      - '.github/workflows/build-pbs-mobile.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f || true
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager missing"; exit 1; fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate PBS launcher icon
        run: |
          python -m pip install Pillow
          python pbs-mobile/tools/generate_icon.py
      - name: Build installable Android APK
        working-directory: pbs-mobile
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm consolidated app version and manifest
        run: |
          set -eu
          grep -q "versionCode 5" pbs-mobile/app/build.gradle
          grep -q "versionName '1.0.4'" pbs-mobile/app/build.gradle
          grep -q "basl.pbsgroup.id" pbs-mobile/app/src/main/java/id/pbsgroup/pbsmobile/MainActivity.java
          grep -q "balap.pbsgroup.id" pbs-mobile/app/src/main/java/id/pbsgroup/pbsmobile/MainActivity.java
          grep -q "applicationId 'id.pbsgroup.pbsbalap.forms'" pbs-mobile/app/build.gradle
          grep -q 'android:label="PBS Balap"' pbs-mobile/app/src/main/AndroidManifest.xml
          test -s pbs-mobile/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK file
        uses: actions/upload-artifact@v4
        with:
          name: PBS_Balap_Forms_v1.0.4_NO_CONFLICT_APK
          path: pbs-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
