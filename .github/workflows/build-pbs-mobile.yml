name: Build PBS Mobile APK
on:
  push:
    branches: [pbs-mobile-android-v1]
    paths:
      - 'pbs-mobile/**'
      - '.github/workflows/build-pbs-mobile.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate PBS launcher icon
        run: |
          python -m pip install Pillow
          python pbs-mobile/tools/generate_icon.py
      - name: Build installable Android APK
        working-directory: pbs-mobile
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK file
        uses: actions/upload-artifact@v4
        with:
          name: PBS_Mobile_v1.0.0_APK
          path: pbs-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
